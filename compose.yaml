services:
  web:
    image: docker.io/library/node:24-bookworm-slim
    working_dir: /app
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
